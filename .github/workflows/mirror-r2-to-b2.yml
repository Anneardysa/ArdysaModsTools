# GitHub Actions Workflow: Mirror R2 to Backblaze B2
#
# Keeps cdn2 (Backblaze B2 via the Cloudflare Worker proxy) carrying the same objects as R2, so the
# fallback in CdnConfig.GetCdnBaseUrls() resolves to a real copy of every asset rather than a 404.
#
# Why a mirror instead of a second upload in each pipeline: three separate writers publish to R2 —
# ModsPack's local sync-to-r2.ps1 (Assets/, remote/, config/, dataset/), release.yml (the delta file
# tree) and sync-release-to-r2.yml (installers, releases.json, whatsnew.json). Teaching each one to
# also push to B2 means three implementations to keep in step, and still misses anything uploaded by
# hand. Mirroring the bucket covers every writer at once, whatever put the object there.
#
# Triggers:
#   - workflow_run : right after "Sync Release to R2" finishes, so a release mirrors immediately
#   - schedule     : catches the local ModsPack sync, which runs on a workstation and cannot
#                    trigger a workflow itself
#   - workflow_dispatch : on demand, with a dry-run option
#
# Required repository secrets (separate from the Worker's own bindings):
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT  — already used by sync-release-to-r2.yml
#   B2_ACCESS_KEY_ID / B2_SECRET_ACCESS_KEY  — a B2 application key's keyID and applicationKey,
#     scoped to the mirror bucket, holding listFiles/readFiles/writeFiles/deleteFiles.
#
# B2_ENDPOINT and B2_REGION are set on the repo but are NOT read here: this job talks to B2's
# native API, which needs neither. They belong to the Worker's S3 client. Leave them in place.

name: Mirror R2 to B2

on:
   workflow_run:
      workflows: ["Sync Release to R2"]
      types: [completed]
   schedule:
      # Every 6 hours. The window only delays the fallback copy — R2 serves the moment a sync lands.
      - cron: "0 */6 * * *"
   workflow_dispatch:
      inputs:
         dry_run:
            description: "List what would change without transferring anything"
            required: false
            type: boolean
            default: false
         max_delete:
            description: "Abort if the mirror would delete more objects than this"
            required: false
            type: string
            default: "50"

env:
   R2_BUCKET: modspack-asset
   # Plural, and deliberately different from the R2 bucket name — it matches B2_BUCKET_NAME in
   # scripts/cf-worker-b2-proxy.js (ModsPack repo), which is what cdn2 actually reads from.
   B2_BUCKET: modspack-assets
   CDN2_BASE_URL: https://cdn2.ardysamods.my.id

permissions:
   contents: read

jobs:
   mirror:
      runs-on: ubuntu-latest
      # A failed release sync may have left R2 half-written; mirroring that would propagate the mess.
      if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

      steps:
         - name: Install rclone
           run: |
              set -e
              curl -sO https://downloads.rclone.org/rclone-current-linux-amd64.zip
              unzip -q rclone-current-linux-amd64.zip
              sudo mv rclone-*-linux-amd64/rclone /usr/local/bin/
              rclone version

         - name: Configure rclone remotes
           run: |
              set -e
              mkdir -p ~/.config/rclone
              cat > ~/.config/rclone/rclone.conf << 'EOF'
              [r2]
              type = s3
              provider = Cloudflare
              access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
              secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
              endpoint = ${{ secrets.R2_ENDPOINT }}
              acl = private
              no_check_bucket = true

              # Backblaze's own API, not its S3-compatible one. The S3 layer rejects HeadObject on
              # this bucket with 403 even for a key holding every capability (listFiles, readFiles,
              # writeFiles, deleteFiles, no namePrefix) — listing succeeds, per-object metadata does
              # not — which stalls `sync` on the first existing object it has to compare. The native
              # backend gets sizes and timestamps out of b2_list_file_names and never issues a
              # HeadObject, so it sidesteps the whole problem rather than working around it.
              #
              # `account` is the keyID and `key` is the applicationKey — the same pair B2 hands out
              # as the S3 access-key id/secret, so B2_ACCESS_KEY_ID / B2_SECRET_ACCESS_KEY carry over
              # untouched. B2_ENDPOINT and B2_REGION are unused here; the Worker still needs them.
              [b2]
              type = b2
              account = ${{ secrets.B2_ACCESS_KEY_ID }}
              key = ${{ secrets.B2_SECRET_ACCESS_KEY }}
              hard_delete = true
              EOF

              echo "Source (R2):"
              rclone lsd "r2:${R2_BUCKET}" --max-depth 1
              echo "Destination (B2):"
              rclone lsd "b2:${B2_BUCKET}" --max-depth 1

         - name: Mirror bucket
           run: |
              set -eo pipefail

              MAX_DELETE="${{ github.event.inputs.max_delete || '50' }}"
              DRY=""
              [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"

              # `sync`, not `copy`: sync-release-to-r2.yml prunes old release folders (RELEASES_TO_KEEP),
              # and a copy-only mirror would keep serving versions R2 has already retired.
              #
              # --max-delete is the guard that makes that safe. A partial or failed source listing would
              # otherwise read as "everything was deleted" and empty the fallback bucket. Re-keying the
              # dataset tree legitimately exceeds this; that run is meant to fail so a human confirms it,
              # then re-runs from the Actions tab with a raised max_delete.
              #
              # Content-Type is carried over from the source object, which matters for the delta tree:
              # those files are uploaded to R2 as application/octet-stream precisely because Cloudflare
              # rewrites text/html in transit and breaks the SHA-256 gate (DL_006). Do not add a
              # --header-upload override here — it would apply to every object, not just the delta tree.
              #
              # Cache-Control is deliberately not replicated: the Worker sets its own on every response,
              # so whatever B2 stores for it is never seen by a client.
              rclone sync "r2:${R2_BUCKET}" "b2:${B2_BUCKET}" \
                $DRY \
                --max-delete "$MAX_DELETE" \
                --transfers 16 \
                --checkers 32 \
                --fast-list \
                --check-first \
                --retries 3 \
                --retries-sleep 5s \
                --stats 10s \
                --stats-one-line \
                -v

         - name: Verify mirror
           if: ${{ github.event.inputs.dry_run != 'true' }}
           run: |
              set -eo pipefail

              R2_SIZE=$(rclone size "r2:${R2_BUCKET}" --json)
              B2_SIZE=$(rclone size "b2:${B2_BUCKET}" --json)
              R2_COUNT=$(echo "$R2_SIZE" | jq -r '.count'); R2_BYTES=$(echo "$R2_SIZE" | jq -r '.bytes')
              B2_COUNT=$(echo "$B2_SIZE" | jq -r '.count'); B2_BYTES=$(echo "$B2_SIZE" | jq -r '.bytes')

              echo "R2: $R2_COUNT objects / $R2_BYTES bytes"
              echo "B2: $B2_COUNT objects / $B2_BYTES bytes"

              if [ "$R2_COUNT" != "$B2_COUNT" ] || [ "$R2_BYTES" != "$B2_BYTES" ]; then
                echo "::error::Mirror is not identical to R2 after sync."
                exit 1
              fi

              # Informational only — never a gate. Matching buckets say nothing about whether the
              # Worker route in front of B2 still serves, so probing cdn2 is genuinely worth doing;
              # it just cannot be done from here. The zone runs Bot Fight Mode (the same feature that
              # rewrote text/html in transit and broke the delta SHA-256 gate, DL_006), which blocks
              # datacenter ASNs — so every one of these returns 403 from a GitHub runner while the
              # identical request from a normal client returns 200. Verified by testing both, and by
              # ruling out User-Agent: a curl UA from a residential IP is served fine.
              #
              # Failing on that would be a red check that can never go green and cannot distinguish
              # a real cdn2 outage from the bot rule. To actually confirm cdn2 serves, request one of
              # these from a normal network — prefer an uncached path so the answer comes from B2 and
              # not the edge (`cf-cache: HIT` proves nothing about the origin).
              echo "cdn2 reachability (403 expected from CI — see comment):"
              for p in Assets/set_update.json Assets/heroes.json config/misc_config.json releases/releases.json; do
                echo "  $(curl -s -o /dev/null -w '%{http_code}' "${CDN2_BASE_URL}/${p}")  ${CDN2_BASE_URL}/${p}"
              done

              echo "✅ B2 mirrors R2 object-for-object and byte-for-byte."

         - name: Summary
           if: always()
           run: |
              {
                echo "## Mirror R2 → B2"
                echo ""
                echo "| Property | Value |"
                echo "|----------|-------|"
                echo "| **Trigger** | \`${{ github.event_name }}\` |"
                echo "| **Source** | \`r2:${R2_BUCKET}\` |"
                echo "| **Destination** | \`b2:${B2_BUCKET}\` |"
                echo "| **Dry run** | ${{ github.event.inputs.dry_run || 'false' }} |"
              } >> $GITHUB_STEP_SUMMARY
