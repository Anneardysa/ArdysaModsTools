# Pull requests on the public mirror.
#
# This repository is a one-way published mirror: every sync does a hard reset of main, and the
# project does not accept code from outside it. The `policy` job tells the author so and closes
# the PR. Bug reports and requests go through issues instead (see .github/CONTRIBUTING.md).
#
# pull_request_target because closing and commenting need write access, and fork PRs get a
# read-only token on `pull_request`. The job never checks out PR code, so running it from the
# base branch is safe.

name: Pull request

on:
   pull_request_target:
      types: [opened, reopened]

jobs:
   policy:
      if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
      runs-on: ubuntu-latest
      permissions:
         pull-requests: write
      steps:
         - uses: actions/github-script@v7
           with:
              script: |
                 await github.rest.issues.addLabels({
                    ...context.repo, issue_number: context.issue.number,
                    labels: ['pr: mirror-policy'],
                 }).catch(e => core.warning(`could not label: ${e.message}`));

                 await github.rest.issues.createComment({
                    ...context.repo, issue_number: context.issue.number,
                    body: [
                       "Thanks for taking the time. This project does not accept code from outside the",
                       "project, so this pull request is closed without being merged or applied.",
                       "",
                       "This repository is a one-way published mirror of a private upstream, and outside",
                       "patches and collaborators are not taken.",
                       "",
                       "If you found a bug or want something changed, please open an issue and describe it:",
                       "https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/issues/new/choose",
                       "",
                       "Full details: [CONTRIBUTING.md](https://github.com/" +
                          context.repo.owner + "/" + context.repo.repo +
                          "/blob/main/.github/CONTRIBUTING.md)",
                    ].join('\n'),
                 });

                 await github.rest.pulls.update({
                    ...context.repo, pull_number: context.issue.number, state: 'closed',
                 });
