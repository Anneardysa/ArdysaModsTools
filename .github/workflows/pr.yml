# Pull requests on the public mirror.
#
# This repository is a one-way published mirror: every sync does a hard reset of main, so a PR
# merged here would be erased by the next publish. We still want the diff — it just gets applied
# upstream by hand rather than merged with the green button. The `policy` job explains that to
# the author so nobody finds out after doing the work.
#
# Two triggers on purpose:
#   pull_request_target - the policy job needs write access to comment, and fork PRs get a
#                         read-only token on `pull_request`. It only ever posts a comment and
#                         never checks out PR code, so running it from the base branch is safe.
#   pull_request        - the build job DOES check out PR code, so it must run with the
#                         read-only token and no access to secrets.

name: Pull request

on:
   pull_request_target:
      types: [opened]
   pull_request:
      branches: [main]

jobs:
   policy:
      if: github.event_name == 'pull_request_target'
      runs-on: ubuntu-latest
      permissions:
         pull-requests: write
      steps:
         - uses: actions/github-script@v7
           with:
              script: |
                 await github.rest.issues.addLabels({
                    ...context.repo, issue_number: context.issue.number,
                    labels: ['pr: mirror-policy'],
                 }).catch(e => core.warning(`could not label: ${e.message}`));

                 await github.rest.issues.createComment({
                    ...context.repo, issue_number: context.issue.number,
                    body: [
                       "Thanks for this — before you read anything into what happens next, here's how",
                       "pull requests work on this repository.",
                       "",
                       "**This repo is a one-way published mirror of a private upstream.** Every publish",
                       "resets `main`, so anything merged here is erased by the next sync. That's a",
                       "property of the publishing mechanism, not a judgement on your change.",
                       "",
                       "**So your patch still lands — it just takes a different route.** A maintainer",
                       "applies your diff upstream, credits you in the commit, and closes this PR with a",
                       "link to the resulting public commit. If there's a linked issue, it closes when the",
                       "fix ships in a release.",
                       "",
                       "What helps most:",
                       "- Link the issue this fixes (open one if it doesn't exist — every change starts there)",
                       "- Keep the diff focused; a small patch is applied in minutes",
                       "- Say what you tested. The VPK binaries aren't published to this mirror, so a",
                       "  mirror-only clone compiles and passes tests but can't run AMT end-to-end —",
                       "  tell us what you could and couldn't verify",
                       "",
                       "The build check on this PR is real and worth watching.",
                       "",
                       "Full details: [CONTRIBUTING.md](https://github.com/" +
                          context.repo.owner + "/" + context.repo.repo +
                          "/blob/main/.github/CONTRIBUTING.md)",
                    ].join('\n'),
                 });

   build:
      if: github.event_name == 'pull_request'
      runs-on: windows-latest
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-dotnet@v4
           with:
              dotnet-version: "8.0.x"

         - name: Build
           run: |
              dotnet restore ArdysaModsTools.csproj
              dotnet build ArdysaModsTools.csproj -c Release --no-restore

         - name: Test
           run: |
              dotnet restore Tests/ArdysaModsTools.Tests.csproj
              dotnet test Tests/ArdysaModsTools.Tests.csproj -c Release --no-restore
