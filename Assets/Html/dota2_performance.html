      <style>
         :root {
            --canvas: #000000;
            --panel-2: #050505;
            --panel-hover: rgba(20, 20, 20, 0.95);
            --hairline: #222222;
            --hairline-strong: #333333;

            --accent: #ffffff;
            --primary: #ffffff;
            --on-primary: #000000;
            --primary-hover: #e5e5e5;

            --wash: rgba(255, 255, 255, 0.04);
            --divider: rgba(255, 255, 255, 0.08);

            --ink: #ffffff;
            --body: #888888;
            --mute: #444444;
         }

         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
         }
         body {
            font-family: "JetBrains Mono", monospace;
            background: var(--canvas);
            background-image:
               linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
               linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--ink);
            overflow: hidden;
            font-size: 14px;
            user-select: none;
         }

         ::-webkit-scrollbar {
            width: 8px;
         }
         ::-webkit-scrollbar-track {
            background: transparent;
         }
         ::-webkit-scrollbar-thumb {
            background: var(--hairline);
         }
         ::-webkit-scrollbar-thumb:hover {
            background: var(--hairline-strong);
         }

         .glass {
            background: var(--panel-2);
            border: 1px solid var(--hairline-strong);
         }
         .preset-btn {
            transition: all 0.18s ease;
            border: 1px solid var(--hairline);
            background: var(--panel-2);
         }
         .preset-btn:hover {
            border-color: var(--hairline-strong);
            background: var(--panel-hover);
            box-shadow: inset 2px 0 0 var(--accent);
         }
         .preset-btn.active {
            border-color: #e8c878;
            background: rgba(232, 200, 120, 0.1);
            box-shadow: inset 3px 0 0 #e8c878, 0 0 16px rgba(232, 200, 120, 0.18);
         }
         .preset-btn.active .text-amt-accent {
            color: #e8c878;
         }

         .toggle-track {
            width: 42px;
            height: 22px;
            border-radius: 0;
            background: var(--panel-hover);
            border: 1px solid var(--hairline-strong);
            position: relative;
            cursor: pointer;
            transition: all 0.18s ease;
            flex-shrink: 0;
         }
         .toggle-track.on {
            background: var(--primary);
            border-color: var(--primary);
         }
         .toggle-thumb {
            width: 16px;
            height: 16px;
            border-radius: 0;
            background: var(--body);
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.18s, background 0.18s;
         }
         .toggle-track.on .toggle-thumb {
            background: var(--on-primary);
            transform: translateX(20px);
         }

         .category-header {
            cursor: pointer;
            transition: background 0.15s;
         }
         .category-header:hover {
            background: var(--wash);
         }
         .category-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
         }
         .category-content.open {
            max-height: 3000px;
         }

         .setting-row {
            transition: background 0.15s;
         }
         .setting-row:hover {
            background: var(--wash);
         }

         select.cvar-select {
            background: var(--panel-2);
            border: 1px solid var(--hairline-strong);
            color: var(--ink);
            padding: 8px 12px;
            border-radius: 0;
            font-family: "JetBrains Mono", monospace;
            font-size: 14px;
            cursor: pointer;
            outline: none;
         }
         select.cvar-select:focus {
            border-color: var(--accent);
         }
         input.cvar-input {
            background: var(--panel-2);
            border: 1px solid var(--hairline-strong);
            color: var(--ink);
            padding: 8px 12px;
            border-radius: 0;
            font-family: "JetBrains Mono", monospace;
            font-size: 14px;
            width: 100px;
            outline: none;
            text-align: center;
         }
         input.cvar-input:focus {
            border-color: var(--accent);
         }

         .action-btn {
            transition: all 0.2s;
         }
         .action-btn:hover {
            transform: translateY(-1px);
         }
         .action-btn:active {
            transform: translateY(0);
         }
         .action-btn.armed {
            background: #ff8983 !important;
            border-color: #ff8983 !important;
            color: #000 !important;
         }

         .tab-btn {
            transition: all 0.18s;
            border-bottom: 2px solid transparent;
            color: var(--body);
         }
         .tab-btn:hover {
            color: var(--ink);
         }
         .tab-btn.active {
            color: var(--ink);
            border-bottom-color: var(--accent);
         }

         .launch-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--panel-2);
            border: 1px solid var(--hairline-strong);
            border-radius: 0;
            padding: 6px 12px;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            color: var(--body);
            transition: all 0.15s;
            cursor: pointer;
         }
         .launch-tag.enabled {
            border-color: var(--accent);
            color: var(--ink);
            background: var(--wash);
         }
         .launch-tag .tag-x {
            cursor: pointer;
            color: var(--mute);
            font-size: 14px;
         }
         .launch-tag .tag-x:hover {
            color: #ff8983;
         }

         @keyframes fadeIn {
            from {
               opacity: 0;
               transform: translateY(8px);
            }
            to {
               opacity: 1;
               transform: translateY(0);
            }
         }
         .fade-in {
            animation: fadeIn 0.35s ease both;
         }

         .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            min-width: 290px;
            max-width: 400px;
            padding: 14px 16px;
            border-radius: 0;
            background: var(--panel-2);
            border: 1px solid var(--hairline-strong);
            z-index: 1000;
            transform: translateX(130%);
            opacity: 0;
            transition: transform 0.34s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.34s ease;
            pointer-events: none;
            box-shadow:
               0 18px 50px rgba(0, 0, 0, 0.75),
               inset 3px 0 0 var(--body);
         }
         .toast.show {
            transform: translateX(0);
            opacity: 1;
         }
         .toast-ico {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin-top: 1px;
            color: var(--body);
         }
         .toast-body {
            flex: 1;
            min-width: 0;
         }
         .toast-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--ink);
            margin-bottom: 3px;
         }
         .toast-msg {
            font-size: 12px;
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: 0.2px;
            color: var(--body);
            word-break: break-word;
         }
         .toast.success {
            border-color: var(--mute);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75), inset 3px 0 0 #3fb950;
         }
         .toast.success .toast-ico,
         .toast.success .toast-title {
            color: #56d364;
         }
         .toast.error {
            border-color: rgba(248, 81, 73, 0.55);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75), inset 3px 0 0 #f85149;
         }
         .toast.error .toast-ico,
         .toast.error .toast-title {
            color: #ff7b72;
         }
         .toast.warning {
            border-color: rgba(232, 200, 120, 0.55);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75), inset 3px 0 0 #e8c878;
         }
         .toast.warning .toast-ico,
         .toast.warning .toast-title {
            color: #e8c878;
         }
         .toast.info {
            border-color: var(--hairline-strong);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75), inset 3px 0 0 var(--accent);
         }
         .toast.info .toast-ico,
         .toast.info .toast-title {
            color: var(--ink);
         }

         .diff-badge {
            display: inline-block;
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 0;
            margin-left: 8px;
            background: rgba(232, 200, 120, 0.12);
            color: #e8c878;
            border: 1px solid rgba(232, 200, 120, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
         }

         .cfg-banner {
            display: none;
            align-items: center;
            gap: 12px;
            margin: 14px 20px 0;
            padding: 12px 14px;
            position: relative;
            background: var(--panel-2);
            border: 1px solid var(--hairline-strong);
            box-shadow: inset 3px 0 0 var(--body);
            animation: fadeIn 0.3s ease both;
         }
         .cfg-banner.show {
            display: flex;
         }
         .cfg-banner.warning {
            background: rgba(232, 200, 120, 0.08);
            border-color: rgba(232, 200, 120, 0.45);
            box-shadow: inset 3px 0 0 #e8c878;
         }
         .cfg-banner.success {
            background: var(--wash);
            border-color: var(--hairline-strong);
            box-shadow: inset 3px 0 0 var(--accent);
         }
         .cfg-banner-ico {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            color: var(--body);
         }
         .cfg-banner.warning .cfg-banner-ico {
            color: #e8c878;
         }
         .cfg-banner.success .cfg-banner-ico {
            color: var(--ink);
         }
         .cfg-banner-text {
            flex: 1;
            min-width: 0;
         }
         .cfg-banner-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink);
         }
         .cfg-banner.warning .cfg-banner-title {
            color: #e8c878;
         }
         .cfg-banner-msg {
            font-size: 12px;
            line-height: 1.5;
            color: var(--body);
            margin-top: 3px;
         }
         .cfg-banner-x {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: 1px solid transparent;
            color: var(--mute);
            cursor: pointer;
            transition: all 0.15s;
         }
         .cfg-banner-x:hover {
            color: #ff8983;
         }
         .cfg-banner-x svg {
            width: 13px;
            height: 13px;
         }

         [data-theme="light"] .preset-btn.active {
            border-color: #946e14;
            background: rgba(232, 200, 120, 0.25);
            box-shadow: inset 3px 0 0 #946e14, 0 0 16px rgba(232, 200, 120, 0.25);
         }
         [data-theme="light"] .preset-btn.active .text-amt-accent {
            color: #6f520d;
         }
         [data-theme="light"] #deleteCfgBtn {
            color: #b3261e;
            border-color: rgba(179, 38, 30, 0.5);
         }
         [data-theme="light"] #deleteCfgBtn:hover {
            background: rgba(179, 38, 30, 0.12);
         }
